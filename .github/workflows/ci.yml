name: CI/CD

on:
  push:
  pull_request:

# A newer push to the same branch cancels the run that's still going.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  checks:
    name: Lint, typecheck & unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6 # version comes from package.json "packageManager"

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test

  e2e:
    name: End-to-end tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # The e2e suite drives a production build that calls the real TMDB API.
      TMDB_ACCESS_TOKEN: ${{ secrets.TMDB_ACCESS_TOKEN }}
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Secrets aren't exposed to pull requests from forks; fail with a clear
      # message instead of a wall of TMDB errors.
      - name: Check TMDB token
        run: |
          if [ -z "$TMDB_ACCESS_TOKEN" ]; then
            echo "::error::TMDB_ACCESS_TOKEN secret is not set for this repository/run."
            exit 1
          fi

      - name: Install Playwright's Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Run end-to-end tests
        run: pnpm test:e2e

      - name: Upload traces from failed tests
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-traces
          path: test-results/
          retention-days: 7

  deploy:
    name: Deploy to production
    # Only main, and only once lint, typecheck, unit and e2e tests all pass.
    needs: [checks, e2e]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: production
      url: https://ordinal-interview.vercel.app
    # Never run two production deploys at once; queue them in order instead.
    concurrency:
      group: production-deploy
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          # Only plain Node is needed here; skip the automatic pnpm cache.
          package-manager-cache: false

      # Uploads the source and lets Vercel build it (TMDB_ACCESS_TOKEN lives
      # in the Vercel project's environment variables).
      - name: Deploy to Vercel
        run: node scripts/deploy-vercel.mjs
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID }}
          VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID }}
